name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FIXES_PATCH_NAME: ci-fixes.patch
      WRITE_FIXES: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref != github.event.repository.default_branch &&
            github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/companion/go.mod
          cache: false
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - name: Fix workspace lint and formatting
        shell: bash
        run: |
          check_status=0
          pnpm exec vp check --fix || check_status=$?
          node scripts/companion.ts format
          git --no-pager diff --binary | tee "$RUNNER_TEMP/$FIXES_PATCH_NAME"
          if [ "$WRITE_FIXES" = true ]; then
            git diff --quiet -- .github/workflows/
          else
            test ! -s "$RUNNER_TEMP/$FIXES_PATCH_NAME"
          fi
          exit "$check_status"
      - run: pnpm exec vp run @amita/codemode-sandbox#build
      - run: pnpm exec vp test --config vitest.config.ts
      - run: pnpm --filter @amita/web build
      - name: Commit verified fixes to the PR branch
        if: env.WRITE_FIXES == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -s "$RUNNER_TEMP/$FIXES_PATCH_NAME" ]; then
            exit 0
          fi
          # Apply the verified changes to the PR head without committing the merge result.
          git restore --source=HEAD --staged --worktree -- .
          git switch --detach "$HEAD_SHA"
          git apply --3way --index "$RUNNER_TEMP/$FIXES_PATCH_NAME"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: apply CI lint and formatting fixes'
          ref="refs/heads/$HEAD_REF"
          gh auth setup-git --hostname github.com
          git push --force-with-lease="$ref:$HEAD_SHA" origin "HEAD:$ref"

  deployment-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify deployment with vp-managed Node.js and pnpm
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            debian:bookworm-slim /bin/bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
              for tool in node pnpm bun go; do
                if command -v "$tool"; then
                  echo "Unexpected preinstalled tool: $tool" >&2
                  exit 1
                fi
              done
              ./amita --help
              curl -fsSL https://vite.plus -o /tmp/install-vp.sh
              VP_HOME=/opt/vite-plus VP_NODE_MANAGER=yes bash /tmp/install-vp.sh
              export PATH="/opt/vite-plus/bin:$PATH"
              vp env exec pnpm install --frozen-lockfile
              vp env exec pnpm test:cli
              vp env exec pnpm exec tsc --project scripts/amita/tsconfig.json
              vp env exec pnpm --filter @amita/web build
              vp env exec pnpm exec wrangler deploy --dry-run --config dist/codemode/wrangler.json
              vp env exec pnpm exec wrangler deploy --dry-run --config dist/amita/wrangler.json
            '

  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/companion/go.mod
          cache-dependency-path: apps/companion/go.sum
      - run: node scripts/companion.ts check
      - run: node scripts/companion.ts test
      - run: node scripts/companion.ts build
        if: runner.os == 'macOS'
      - name: Cross-compile Linux binaries
        if: runner.os == 'Linux'
        working-directory: apps/companion
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/amita-companion-linux-amd64 ./cmd/amita-companion
          GOOS=linux GOARCH=arm64 go build -o /tmp/amita-companion-linux-arm64 ./cmd/amita-companion
